<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" font-family="sans-serif">
  <defs>
    <linearGradient id="s2wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF6"/><stop offset="1" stop-color="#F6EFE3"/>
    </linearGradient>
    <linearGradient id="s2sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCEEF7"/><stop offset="1" stop-color="#EAF6FB"/>
    </linearGradient>
  </defs>

  <!-- 背景：壁 -->
  <rect width="600" height="450" fill="url(#s2wall)"/>
  <!-- 床 -->
  <rect y="320" width="600" height="130" fill="#E7D4BA"/>
  <rect y="320" width="600" height="9" fill="#D8C0A0"/>

  <!-- 窓（右奥） -->
  <rect x="390" y="40" width="180" height="220" rx="8" fill="url(#s2sky)" stroke="#CBB89C" stroke-width="7"/>
  <rect x="477" y="40" width="7" height="220" fill="#CBB89C"/>
  <rect x="390" y="145" width="180" height="7" fill="#CBB89C"/>
  <!-- 窓外の緑 -->
  <circle cx="420" cy="200" r="38" fill="#86B96B"/>
  <circle cx="460" cy="180" r="48" fill="#6FA85A"/>
  <circle cx="540" cy="195" r="38" fill="#86B96B"/>
  <rect x="390" y="242" width="180" height="18" fill="#BFE0C2" opacity=".7"/>

  <!-- 平行棒（左側） -->
  <!-- 支柱4本 -->
  <rect x="60" y="260" width="12" height="70" rx="4" fill="#A09080"/>
  <rect x="200" y="260" width="12" height="70" rx="4" fill="#A09080"/>
  <rect x="70" y="280" width="12" height="55" rx="4" fill="#A09080"/>
  <rect x="198" y="280" width="12" height="55" rx="4" fill="#A09080"/>
  <!-- 横バー2本 -->
  <rect x="55" y="220" width="165" height="14" rx="7" fill="#3A7CA5"/>
  <rect x="60" y="240" width="155" height="10" rx="5" fill="#2C5F80"/>
  <!-- もう1本の横バー（下側） -->
  <rect x="55" y="255" width="165" height="12" rx="6" fill="#3A7CA5"/>

  <!-- 歩行訓練中の高齢者（平行棒の間） -->
  <g>
    <!-- 体 -->
    <path d="M95 365 q40 -110 80 0 z" fill="#6FA1C0"/>
    <!-- 腕（バーに手をかける） -->
    <path d="M108 290 q-20 -25 -40 -10" stroke="#F3C9A2" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M162 290 q20 -25 40 -10" stroke="#F3C9A2" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- 手（丸） -->
    <circle cx="68" cy="232" r="9" fill="#F3C9A2"/>
    <circle cx="202" cy="232" r="9" fill="#F3C9A2"/>
    <!-- 頭 -->
    <circle cx="135" cy="222" r="44" fill="#F3C9A2"/>
    <!-- 髪（白髪） -->
    <path d="M93 218 q42 -60 84 0 q-8 -36 -42 -36 q-34 0 -42 36" fill="#ECEAE6"/>
    <!-- 目 -->
    <circle cx="120" cy="224" r="4.5" fill="#5b4636"/>
    <circle cx="150" cy="224" r="4.5" fill="#5b4636"/>
    <!-- 口 -->
    <path d="M123 238 q12 12 24 0" stroke="#b06a4e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- ほお紅 -->
    <circle cx="108" cy="233" r="7" fill="#F4A6A0" opacity=".55"/>
    <circle cx="162" cy="233" r="7" fill="#F4A6A0" opacity=".55"/>
  </g>

  <!-- 椅子体操中の高齢者（中央） -->
  <!-- 椅子 -->
  <rect x="268" y="298" width="64" height="8" rx="3" fill="#C8A97A"/>
  <rect x="270" y="306" width="8" height="50" rx="3" fill="#C8A97A"/>
  <rect x="322" y="306" width="8" height="50" rx="3" fill="#C8A97A"/>
  <rect x="258" y="298" width="14" height="8" rx="3" fill="#B89060"/>
  <rect x="328" y="298" width="14" height="8" rx="3" fill="#B89060"/>
  <!-- 背もたれ -->
  <rect x="268" y="244" width="64" height="56" rx="6" fill="#D9B882"/>

  <g>
    <!-- 体（椅子に座った台形） -->
    <path d="M272 355 q28 -60 56 0 z" fill="#D9774B"/>
    <!-- 腕（腕を上に上げている） -->
    <path d="M280 300 q-12 -40 -8 -70" stroke="#F3C9A2" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M320 300 q12 -40 8 -70" stroke="#F3C9A2" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="272" cy="226" r="8" fill="#F3C9A2"/>
    <circle cx="328" cy="226" r="8" fill="#F3C9A2"/>
    <!-- 頭 -->
    <circle cx="300" cy="222" r="44" fill="#E8B894"/>
    <!-- 髪（グレー） -->
    <path d="M258 218 q42 -62 84 0 q-4 -40 -42 -40 q-38 0 -42 40" fill="#B9B2A8"/>
    <circle cx="285" cy="224" r="4.5" fill="#5b4636"/>
    <circle cx="315" cy="224" r="4.5" fill="#5b4636"/>
    <path d="M288 239 q12 11 24 0" stroke="#b06a4e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="273" cy="234" r="7" fill="#F4A6A0" opacity=".55"/>
    <circle cx="327" cy="234" r="7" fill="#F4A6A0" opacity=".55"/>
  </g>

  <!-- 職員（青エプロン、右側に寄り添う） -->
  <g>
    <!-- 体 -->
    <path d="M440 390 q50 -160 100 0 z" fill="#3A7CA5"/>
    <!-- エプロン紐 -->
    <rect x="474" y="290" width="32" height="90" fill="#2C5F80" opacity=".5"/>
    <!-- 腕（伸ばして支援） -->
    <path d="M450 315 q-40 -10 -80 -10" stroke="#F3C9A2" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="368" cy="305" r="9" fill="#F3C9A2"/>
    <!-- 頭 -->
    <circle cx="490" cy="220" r="46" fill="#F3C9A2"/>
    <!-- 髪（黒） -->
    <path d="M446 216 q44 -64 88 0 q-6 -42 -44 -42 q-38 0 -44 42" fill="#4a3b2e"/>
    <circle cx="475" cy="222" r="4.5" fill="#3b2e23"/>
    <circle cx="505" cy="222" r="4.5" fill="#3b2e23"/>
    <path d="M477 237 q13 12 26 0" stroke="#b06a4e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="462" cy="232" r="7" fill="#F4A6A0" opacity=".5"/>
    <circle cx="518" cy="232" r="7" fill="#F4A6A0" opacity=".5"/>
  </g>

  <!-- 観葉植物 左奥 -->
  <rect x="22" y="280" width="12" height="50" fill="#8B6B4A"/>
  <circle cx="28" cy="262" r="26" fill="#7FB069"/>
  <circle cx="44" cy="272" r="18" fill="#6FA85A"/>

  <!-- 床ハイライト -->
  <ellipse cx="300" cy="432" rx="270" ry="16" fill="#F0E2CC" opacity=".5"/>
</svg>
