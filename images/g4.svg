<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" font-family="sans-serif">
  <defs>
    <linearGradient id="g4bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF6"/><stop offset="1" stop-color="#F2E8D8"/>
    </linearGradient>
    <linearGradient id="g4table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DEB878"/><stop offset="1" stop-color="#C09050"/>
    </linearGradient>
    <linearGradient id="g4bowl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C87848"/><stop offset="1" stop-color="#A05830"/>
    </linearGradient>
    <linearGradient id="g4plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F2E8"/><stop offset="1" stop-color="#EDE4D4"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="750" fill="url(#g4bg)"/>

  <!-- テーブル面（上から見た俯瞰と側面の混合・温かい和の雰囲気） -->
