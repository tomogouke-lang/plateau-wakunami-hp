  <ellipse cx="64" cy="540" rx="14" ry="5" fill="#6FA890" opacity=".7"/>

  <!-- 壁のアクセント（左上に和の模様） -->
  <rect x="0" y="0" width="600" height="120" fill="#FBF6EE" opacity=".4"/>
  <!-- 和の窓格子イメージ（薄く） -->
  <line x1="0" y1="115" x2="600" y2="115" stroke="#D4BCA0" stroke-width="3" opacity=".4"/>
</svg>
