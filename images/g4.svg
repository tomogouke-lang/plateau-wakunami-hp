  <rect x="104" y="590" width="315" height="7" rx="3.5" fill="#8B5A3A" transform="rotate(3 104 590)"/>
  <!-- はし置き -->
  <rect x="95" y="593" width="34" height="12" rx="5" fill="#88B0A0"/>

