  <ellipse cx="145" cy="468" rx="16" ry="7" fill="#FAFAF8" opacity=".8"/>
  <ellipse cx="170" cy="466" rx="12" ry="6" fill="#FAFAF5" opacity=".7"/>
  <ellipse cx="158" cy="460" rx="20" ry="6" fill="#F8F5E8" opacity=".6"/>
