  <ellipse cx="158" cy="314" rx="12" ry="6" fill="#9ABA58" opacity=".75"/>
  <ellipse cx="145" cy="310" rx="10" ry="5" fill="#E0785A" opacity=".65"/>

  <!-- ===== デザート（右上・水ようかん） ===== -->
  <ellipse cx="452" cy="332" rx="52" ry="13" fill="#A0C0D8" opacity=".3"/>
  <ellipse cx="452" cy="320" rx="50" ry="11" fill="#F0E8D8"/>
  <!-- 水ようかん -->
