  <path d="M300 276 q4 -16 0 -28" stroke="#88B0A0" stroke-width="2" fill="none" stroke-linecap="round" opacity=".6"/>
  <path d="M315 280 q4 -16 0 -28" stroke="#88B0A0" stroke-width="2" fill="none" stroke-linecap="round" opacity=".6"/>

