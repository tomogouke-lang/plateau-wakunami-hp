  <path d="M492 527 q0 26 38 27 q38 1 38 -27 q-1 -32 -38 -32 q-37 0 -38 32" fill="#9CC77E" opacity=".55"/>
  <ellipse cx="530" cy="495" rx="37" ry="11" fill="#7FB069" opacity=".45"/>
  <!-- 茶の表面 -->
  <ellipse cx="530" cy="494" rx="30" ry="8" fill="#B8D88A" opacity=".7"/>
  <!-- 湯気 -->
  <path d="M516 488 q5 -14 1 -24" stroke="#7FB069" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/>
  <path d="M530 482 q5 -14 1 -24" stroke="#7FB069" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/>
  <path d="M544 486 q5 -14 1 -24" stroke="#7FB069" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/>

  <!-- テーブル上の花（和の一輪挿し） -->
  <rect x="60" y="480" width="8" height="60" fill="#8B6B4A" opacity=".7"/>
  <ellipse cx="64" cy="476" rx="12" ry="8" fill="#F4A6A0" opacity=".8"/>
  <ellipse cx="56" cy="468" rx="10" ry="7" fill="#F4C95B" opacity=".8"/>
  <ellipse cx="72" cy="468" rx="9" ry="7" fill="#E8A87C" opacity=".8"/>
