  <ellipse cx="300" cy="620" rx="340" ry="100" fill="#E8C88A"/>
  <ellipse cx="300" cy="620" rx="340" ry="100" fill="none" stroke="#C09050" stroke-width="5"/>
  <!-- テーブルの木目 -->
  <path d="M0 608 q150 -20 300 0 q150 20 300 0" stroke="#C8A060" stroke-width="1.5" fill="none" opacity=".4"/>
  <path d="M20 628 q140 -16 280 0 q140 16 280 0" stroke="#C8A060" stroke-width="1.5" fill="none" opacity=".4"/>

  <!-- テーブルマット（和紙風） -->
  <ellipse cx="300" cy="605" rx="250" ry="72" fill="#F8EED8" opacity=".7"/>

  <!-- 奥のランチョンマット（別客分） -->
  <ellipse cx="300" cy="220" rx="240" ry="60" fill="#F4E8D0" opacity=".5"/>

