<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCEEF7"/><stop offset="1" stop-color="#EAF6FB"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF6"/><stop offset="1" stop-color="#F6EFE3"/>
    </linearGradient>
  </defs>
  <!-- room -->
  <rect width="1600" height="900" fill="url(#wall)"/>
  <rect y="600" width="1600" height="300" fill="#E7D4BA"/>
  <rect y="600" width="1600" height="18" fill="#D8C0A0"/>
  <!-- big windows (sense of light & space) -->
  <g>
    <rect x="120" y="90" width="560" height="380" rx="10" fill="url(#sky)" stroke="#CBB89C" stroke-width="10"/>
    <rect x="395" y="90" width="10" height="380" fill="#CBB89C"/>
    <rect x="120" y="275" width="560" height="10" fill="#CBB89C"/>
    <!-- greenery outside -->
    <circle cx="230" cy="360" r="70" fill="#86B96B"/><circle cx="330" cy="330" r="90" fill="#6FA85A"/>
    <circle cx="520" cy="370" r="80" fill="#86B96B"/><circle cx="600" cy="340" r="60" fill="#9CC77E"/>
    <rect x="120" y="430" width="560" height="40" fill="#BFE0C2" opacity=".7"/>
  </g>
  <rect x="930" y="90" width="560" height="380" rx="10" fill="url(#sky)" stroke="#CBB89C" stroke-width="10"/>
  <rect x="1205" y="90" width="10" height="380" fill="#CBB89C"/>
  <rect x="930" y="275" width="560" height="10" fill="#CBB89C"/>
  <circle cx="1040" cy="360" r="75" fill="#86B96B"/><circle cx="1150" cy="330" r="95" fill="#6FA85A"/>
  <circle cx="1340" cy="365" r="80" fill="#86B96B"/>
  <rect x="930" y="430" width="560" height="40" fill="#BFE0C2" opacity=".7"/>
  <!-- hanging plant + clock for warmth -->
  <circle cx="800" cy="150" r="46" fill="#7FB069"/><rect x="792" y="150" width="16" height="60" fill="#5E8C4F"/>
  <!-- TABLE LEFT with two seniors chatting -->
  <g>
    <ellipse cx="380" cy="700" rx="210" ry="52" fill="#E8A87C"/>
    <ellipse cx="380" cy="688" rx="210" ry="52" fill="#F2BC92"/>
    <!-- person A -->
    <g>
      <path d="M250 690 q60 -150 120 0 z" fill="#6FA1C0"/>
      <circle cx="310" cy="520" r="52" fill="#F3C9A2"/>
      <path d="M260 512 q50 -70 100 0 q-12 -34 -50 -36 q-38 2 -50 36" fill="#ECEAE6"/>
      <circle cx="293" cy="520" r="5" fill="#5b4636"/><circle cx="327" cy="520" r="5" fill="#5b4636"/>
      <path d="M298 540 q12 12 24 0" stroke="#b06a4e" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="280" cy="534" r="7" fill="#F4A6A0" opacity=".55"/><circle cx="340" cy="534" r="7" fill="#F4A6A0" opacity=".55"/>
    </g>
    <!-- person B -->
    <g>
      <path d="M390 690 q60 -150 120 0 z" fill="#D9774B"/>
      <circle cx="450" cy="520" r="52" fill="#E8B894"/>
      <path d="M400 514 q50 -64 100 0 q-6 -40 -50 -40 q-44 0 -50 40" fill="#B9B2A8"/>
