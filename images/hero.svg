    <ellipse cx="330" cy="688" rx="20" ry="9" fill="#fff"/><ellipse cx="430" cy="690" rx="20" ry="9" fill="#fff"/>
  </g>
  <!-- TABLE RIGHT with two seniors + staff -->
  <g>
    <ellipse cx="1150" cy="730" rx="240" ry="58" fill="#88B0A0"/>
    <ellipse cx="1150" cy="716" rx="240" ry="58" fill="#A6C9BB"/>
    <g>
      <path d="M1010 718 q66 -160 132 0 z" fill="#F4C95B"/>
