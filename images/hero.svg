      <path d="M1022 528 q54 -72 108 0 q-8 -42 -54 -42 q-46 0 -54 42" fill="#ECEAE6"/>
      <circle cx="1058" cy="534" r="5.5" fill="#5b4636"/><circle cx="1094" cy="534" r="5.5" fill="#5b4636"/>
      <path d="M1062 556 q14 13 28 0" stroke="#b06a4e" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <circle cx="1044" cy="549" r="8" fill="#F4A6A0" opacity=".55"/><circle cx="1108" cy="549" r="8" fill="#F4A6A0" opacity=".55"/>
    </g>
    <g>
      <path d="M1160 718 q66 -160 132 0 z" fill="#C9806A"/>
      <circle cx="1226" cy="534" r="56" fill="#E8B894"/>
      <path d="M1172 530 q54 -66 108 0 q-4 -44 -54 -44 q-50 0 -54 44" fill="#9C7B5B"/>
      <circle cx="1208" cy="534" r="5.5" fill="#5b4636"/><circle cx="1244" cy="534" r="5.5" fill="#5b4636"/>
      <path d="M1212 556 q14 13 28 0" stroke="#b06a4e" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <circle cx="1194" cy="549" r="8" fill="#F4A6A0" opacity=".55"/><circle cx="1258" cy="549" r="8" fill="#F4A6A0" opacity=".55"/>
    </g>
  </g>
  <!-- staff (brand color apron) standing center, welcoming -->
  <g>
    <path d="M720 760 q60 -210 120 0 z" fill="#3A7CA5"/>
    <rect x="762" y="600" width="36" height="120" fill="#F3C9A2"/>
    <circle cx="780" cy="500" r="50" fill="#F3C9A2"/>
    <path d="M732 498 q48 -66 96 0 q-4 -44 -48 -44 q-44 0 -48 44" fill="#4a3b2e"/>
    <circle cx="765" cy="500" r="5" fill="#3b2e23"/><circle cx="795" cy="500" r="5" fill="#3b2e23"/>
    <path d="M768 518 q12 11 24 0" stroke="#b06a4e" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="753" cy="513" r="7" fill="#F4A6A0" opacity=".5"/><circle cx="807" cy="513" r="7" fill="#F4A6A0" opacity=".5"/>
